# Streamlity'yi derler ve paketler.
# - `v*` etiketi push edilince: Windows dosyalarıyla taslak bir GitHub Release açar.
# - Elle çalıştırılınca (Actions > Release > Run workflow): yalnız derler, dosyalar
#   çalıştırmanın "Artifacts" bölümüne düşer.
# macOS ve Linux henüz denenmediği için release'e eklenmez, yalnız artifact olarak üretilir.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.47.5"

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        name: Sürümü pubspec'ten oku, etiketle karşılaştır
        run: |
          v=$(grep '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//')
          if [[ "$GITHUB_REF_TYPE" == "tag" && "${GITHUB_REF_NAME#v}" != "$v" ]]; then
            echo "::error::Etiket $GITHUB_REF_NAME, pubspec sürümü $v ile uyuşmuyor"
            exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

  windows:
    needs: version
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - run: flutter test
      - run: flutter build windows --release
      - name: VC++ çalışma zamanını pakete ekle
        shell: pwsh
        run: |
          $dst = "build\windows\x64\runner\Release"
          foreach ($f in 'msvcp140.dll', 'vcruntime140.dll', 'vcruntime140_1.dll') {
            Copy-Item "$env:WINDIR\System32\$f" $dst
          }
      - name: Zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist -Force | Out-Null
          Compress-Archive -Path build\windows\x64\runner\Release\* `
            -DestinationPath "dist\Streamlity-$env:VERSION-windows-x64.zip"
      - name: Kurulum dosyası
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }
          & $iscc "/DAppVersion=$env:VERSION" `
            "/DSourceDir=$pwd\build\windows\x64\runner\Release" `
            "/DOutputDir=$pwd\dist" windows\installer\streamlity.iss
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      # SignPath onayı gelince imzalama adımı buraya eklenecek.
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*
          if-no-files-found: error

  macos:
    needs: version
    runs-on: macos-latest
    continue-on-error: true
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - run: flutter build macos --release
      - name: DMG
        run: |
          mkdir -p dist
          hdiutil create -volname Streamlity \
            -srcfolder build/macos/Build/Products/Release/streamlity.app \
            -ov -format UDZO "dist/Streamlity-$VERSION-macos.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/*

  linux:
    needs: version
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Sistem paketleri
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config \
            libgtk-3-dev libmpv-dev libsecret-1-dev libjsoncpp-dev
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - run: flutter build linux --release
      - name: Arşiv
        run: |
          mkdir -p dist
          tar -czf "dist/Streamlity-$VERSION-linux-x64.tar.gz" \
            -C build/linux/x64/release bundle
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/*

  release:
    if: github.ref_type == 'tag'
    needs: [version, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          name: Streamlity ${{ needs.version.outputs.version }}
          draft: true
          prerelease: ${{ startsWith(needs.version.outputs.version, '0.') }}
          generate_release_notes: true
          files: dist/*
